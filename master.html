<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#23465b">
<title>베어링 구매 관리</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--p:#23465b;--bg:#f2f4f6;--line:#d6dde3;--muted:#667583;--ink:#1c2530;
 --gA:#a7382d;--gB:#a34d0b;--gC:#2f6a8a;--gD:#667583;--ok:#1b7f4b}
*{box-sizing:border-box}
.hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #9cb9cf;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:10px 12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:18px}
.chip{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:14px;min-height:38px;text-decoration:none;display:inline-flex;align-items:center}
.sub{font-size:12px;opacity:.85;margin:6px 0 8px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin:0 -4px}
.tab{position:relative;background:transparent;border:0;border-bottom:4px solid transparent;color:#fff;padding:6px 2px 7px;opacity:.72;line-height:1.2}
.tab b{display:block;font-size:19px}
.tab span{display:block;font-size:11px}
.tab i{position:absolute;top:2px;right:4px;font-style:normal;font-size:11px;font-weight:700;min-width:19px;padding:1px 5px;border-radius:10px;background:#fff;color:var(--p)}
.tab i.alert{background:#ff6b5b;color:#fff}
.tab.on{opacity:1;border-bottom-color:#fff}
main{max-width:720px;margin:0 auto;padding:10px 12px}
.intro{font-size:13px;color:#33404d;line-height:1.5;margin:2px 2px 10px}
#q{width:100%;padding:12px;font-size:16px;border:2px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.note{background:#fff3ce;border:1px solid #e8cd85;color:#6b4d0f;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-bottom:10px}
.card{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gD);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.card.gA{border-left-color:var(--gA)}.card.gB{border-left-color:var(--gB)}.card.gC{border-left-color:var(--gC)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.stock{flex:0 0 auto;min-width:54px;text-align:center;border-radius:9px;padding:5px 8px;font-size:19px;font-weight:700;background:#fff0ed;color:var(--gA)}
.stock.warn{background:#fff0da;color:var(--gB)}
.stock small{display:block;font-size:10px;font-weight:500}
.meta{font-size:13px;margin:7px 0 2px;color:#33404d}
.meta b{font-size:14px}
.req{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff3ce;border:1px solid #e8cd85;border-radius:8px;padding:6px 9px;margin-top:8px;font-size:14px;font-weight:700;color:#6b4d0f}
.req.buy{background:#e1eef6;border-color:#a9cbe0;color:#1f4d68}
.act{display:flex;align-items:center;gap:7px;margin-top:9px}
.stepper{display:flex;align-items:center;flex:0 0 auto;border:2px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:42px;border:0;background:#f2f4f6;font-size:22px;color:#33404d}
.stepper input{width:46px;height:42px;border:0;text-align:center;font-size:17px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btn{flex:1;min-height:44px;border-radius:9px;font-size:15px;font-weight:700;border:2px solid var(--p);background:#fff;color:var(--p)}
.btn.buy{background:var(--p);color:#fff}
.btn:disabled{opacity:.45}
.mini{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #b9a25f;background:#fff;color:#6b4d0f;font-size:13px;font-weight:700}
.req.buy .mini{border-color:#7aa9c4;color:#1f4d68}
.req.ord{background:#ece8f8;border-color:#bfb5e3;color:#3d2f86}
.req.ord .mini{border-color:#a99bd8;color:#3d2f86}
.card.gV{border-left-color:#6a4fb3}
.dl{margin-top:9px}
.dl .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.dl .act{margin-top:0}
.dl2{display:flex;gap:8px;margin-top:8px}
.dl2 .mini{flex:1}
.req.run{background:#e1eef6;border-color:#a9cbe0;color:#1f4d68}
.req.ok{background:#e3f4ea;border-color:#9fd0b4;color:#145c38}
.req.bad{background:#fdeae6;border-color:#e3a79d;color:#8f2a20}
.req.chk{background:#fff0da;border-color:#e6bf86;color:#7e4a08}
.req.ok .mini{border-color:#7fbc99;color:#145c38}.req.bad .mini{border-color:#d58d81;color:#8f2a20}.req.chk .mini{border-color:#d9a95f;color:#7e4a08}
.reqbtns{display:flex;gap:6px;flex:0 0 auto}
.rnote{font-size:13px;line-height:1.45;margin-top:5px;color:#33404d;overflow-wrap:anywhere}
.imk{font-size:12px;color:#33404d;margin-top:3px}.imk code{background:#edf0f3;border-radius:5px;padding:1px 6px;font-size:12px}
.noimk{color:var(--gA);font-weight:700}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;margin-bottom:10px}
.banner.bad{background:#fff0ed;border:1px solid #e8b4ac;color:#8f2a20}
.banner.info{background:#edf3f8;border:1px solid #c5d6e3;color:#27465d}
.banner .btn{min-height:40px;margin-top:8px;width:100%;font-size:14px;padding:0 10px}
.empty{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.loaderr{background:#fff0ed;border:1px solid #e8b4ac;color:#8f2a20;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;margin-bottom:10px}
.loaderr small{display:block;color:#a7382d;opacity:.85;margin-top:4px;font-size:12px;overflow-wrap:anywhere}
.srv{margin-top:10px;font-size:11px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.rule{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(20,37,54,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#fff;width:100%;max-width:380px;border-radius:14px;padding:20px 18px}
.panel h2{margin:0 0 6px;font-size:20px}
.panel input{width:100%;padding:13px;font-size:17px;border:2px solid var(--line);border-radius:10px;margin:10px 0 8px}
.err{color:var(--gA);font-size:14px;min-height:20px;margin-bottom:8px}
.panel .btn{width:100%;background:var(--p);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><b>📊 구매 관리</b><div class="row"><button id="refresh" class="chip">새로고침</button><a class="chip" href="./">출고 화면</a></div></div>
  <div id="sub" class="sub">불러오는 중…</div>
  <div id="tabs" class="tabs"></div>
</header>
<main>
  <div id="loadErr" class="loaderr hidden"></div>
  <div id="runnerBanner" class="banner hidden"></div>
  <div id="unregBanner" class="banner bad hidden"></div>
  <div id="verNote" class="banner bad hidden"></div>
  <div id="issueNote" class="note hidden"></div>
  <div id="intro" class="intro"></div>
  <input id="q" type="search" placeholder="번호·규격·위치로 찾기" autocomplete="off">
  <div id="list"></div>
  <div id="rule" class="rule"></div>
</main>

<div id="gate" class="overlay hidden">
  <div class="panel">
    <h2>마스터 PIN</h2>
    <div class="muted">구매 관리는 마스터 PIN으로만 열립니다.</div>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="마스터 PIN">
    <div id="gateErr" class="err"></div>
    <button id="gateOk" class="btn">확인</button>
    <div style="text-align:center;margin-top:12px"><a href="./" class="muted">← 출고 화면으로</a></div>
    <div id="srvInfo" class="srv"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const KEY = 'br_master_pin';
const $ = id => document.getElementById(id);
const lget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
// 서버 주소: 출고 화면(index.html)이 쓰는 주소를 그대로 따라갑니다. (출고 화면을 한 번도 안 연 폰에서만 아래 기본값 사용)
const API_FALLBACK = 'https://script.google.com/macros/s/AKfycbzImLopWKF6a8XvdHv8uCVjLYbFaGtD2OcKNEwUpOaDWa85uCLbhXgNDqAj0x7AYNNR/exec';
const API_URL = (lget('br_api_url') || '').startsWith('https://') ? lget('br_api_url') : API_FALLBACK;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/[\s\-_.×*]/g, '');
const p2 = n => String(n).padStart(2, '0');
function fetchT(u, o = {}, ms = 25000) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(u, { ...o, signal: c.signal }).finally(() => clearTimeout(t)); }
const post = obj => fetchT(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) }).then(r => r.json());

const CATS = { B:'베어링', UB:'유니트베어링', IB:'인서트베어링', PB:'플러머블럭', UBH:'유니트베어링 하우징' };
const catName = code => { const m = /^([A-Za-z]+)-/.exec(code || ''); return m ? (CATS[m[1].toUpperCase()] || '') : ''; };
const TABS = [
  { g: 'A', t: '자주' }, { g: 'B', t: '보통' }, { g: 'C', t: '가끔' }, { g: 'D', t: '이력없음' }, { g: 'R', t: '구매목록' }, { g: 'V', t: '납품' }
];

let pin = '', cands = [], data = null, tab = 'A', q = '', loadedAt = 0, busy = false, tt;

// 사용해 볼 PIN 후보: ① 방금 출고 화면에서 마스터로 로그인한 PIN ② 이 화면에 예전에 저장된 PIN
// (마스터 PIN을 바꾼 뒤에도 ①이 먼저라서 다시 입력하지 않아도 되고, ①이 안 맞으면 ②를 시도합니다)
function pinCandidates() {
  const out = [];
  try { if (JSON.parse(lget('br_role') || 'null') === 'master') { const p = JSON.parse(lget('br_pin') || '""'); if (p) out.push(String(p)); } } catch (e) {}
  const own = lget(KEY);
  if (own && out.indexOf(own) < 0) out.push(own);
  return out;
}
const myName = () => { try { return JSON.parse(lget('br_name') || '""') || '마스터'; } catch (e) { return '마스터'; } };
const srvTail = () => '…' + API_URL.replace(/\/exec$/, '').slice(-10);

function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
function showGate(msg) {
  $('gateErr').textContent = msg || '';
  $('srvInfo').textContent = '연결 서버 ' + srvTail() + (lget('br_api_url') ? ' (출고 화면과 같은 주소)' : ' (기본 주소)');
  $('gate').classList.remove('hidden'); setTimeout(() => $('pinIn').focus(), 50);
}
function setErr(msg, detail) {
  const e = $('loadErr');
  if (!msg) { e.classList.add('hidden'); e.textContent = ''; return; }
  e.innerHTML = esc(msg) + (detail ? '<small>' + esc(detail) + '</small>' : '');
  e.classList.remove('hidden');
}

// 서버 코드가 구매 관리를 지원하는 최신 버전인지 확인 (PIN이 안 맞을 때 원인 구분용)
async function serverInfo() {
  try { const r = await fetchT(API_URL, {}, 12000); const j = await r.json(); return j && j.ok ? (j.master ? 'new' : 'old') : 'bad'; }
  catch (e) { return 'down'; }
}

// 요청 한 번. 결과를 {ok, data} 또는 {kind, msg, detail} 로 정리합니다. (화면에 보이지 않게 실패하는 일이 없도록)
async function call(p) {
  let r, text;
  try { r = await fetchT(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: p, action: 'master' }) }, 30000); text = await r.text(); }
  catch (e) { return { kind: 'NET', msg: '서버에 연결하지 못했습니다. 인터넷 상태를 확인하세요.', detail: String(e && e.name || e) }; }
  let d; try { d = JSON.parse(text); }
  catch (e) { return { kind: 'NOTJSON', msg: '서버가 올바른 응답을 주지 않았습니다. Apps Script 배포가 "실행 계정: 나 / 액세스: 모든 사용자"인지, 코드를 바꾼 뒤 [배포 관리 > 수정 > 새 버전]으로 배포했는지 확인하세요.', detail: 'HTTP ' + r.status + ' · ' + text.replace(/\s+/g, ' ').slice(0, 80) }; }
  if (d.ok) return { ok: true, data: d };
  return { kind: d.error || 'ERR', msg: d.msg || '', detail: d.error || '' };
}

async function load(manual) {
  if (busy) return;
  if (!pin && !cands.length) { showGate(''); return; }
  busy = true;
  try {
    let res = null, tried = '';
    const list = pin ? [pin] : cands.slice();
    for (const p of list) {
      res = await call(p);
      if (res.ok) { pin = p; break; }
      if (res.kind !== 'PIN' && res.kind !== 'FORBIDDEN') break; // PIN 문제가 아니면 다른 PIN을 시도해도 소용없음
      tried = res.kind;
    }
    cands = []; // 후보는 한 번만 사용
    if (res.ok) {
      data = res.data; loadedAt = Date.now(); lset(KEY, pin);
      $('gate').classList.add('hidden'); setErr('');
      render();
      if (manual) toast('새로 불러왔습니다');
    } else if (res.kind === 'PIN' || res.kind === 'FORBIDDEN') {
      pin = '';
      let msg = res.kind === 'FORBIDDEN' ? '마스터 PIN이 아닙니다. (현장·관리자 PIN으로는 열 수 없습니다)' : 'PIN이 맞지 않습니다.';
      const st = await serverInfo();
      if (st === 'old') msg = '이 서버 주소는 구매 관리가 없는 예전 버전입니다. Apps Script에서 코드를 새로 붙여넣고 [배포 관리 > 수정 > 새 버전]으로 다시 배포해주세요.';
      else if (st === 'new') msg += ' 스크립트 속성 MASTER_PIN 값(앞뒤 공백 없이)과 같은지 확인하세요.';
      else if (st === 'down') msg += ' (서버 연결도 확인하지 못했습니다)';
      showGate(msg);
    } else {
      const m = res.msg || '불러오지 못했습니다.';
      if (!$('gate').classList.contains('hidden')) { pin = ''; $('gateErr').textContent = m + (res.detail ? ' [' + res.detail + ']' : ''); } // PIN 입력창이 떠 있으면 거기에 이유를 보여줌
      else if (data) { toast(m); setErr(m, res.detail); }
      else { $('sub').textContent = '불러오지 못했습니다'; setErr(m, res.detail + ' · 서버 ' + srvTail()); }
    }
  } catch (e) {
    setErr('화면을 그리는 중 오류가 발생했습니다.', String(e && e.message || e));
  } finally { busy = false; }
}

// 아직 발주 전(장바구니 단계) 요청 / 발주를 마치고 납품을 기다리는 요청
const ORDERED = '발주완료';
const preOrder = () => data.requests.filter(r => r.st !== ORDERED);
const ordered = () => data.requests.filter(r => r.st === ORDERED);
// 분납 잔량 표시: note 'rem:받은수/주문수'
const remInfo = note => { const m = /^rem:(\d+)\/(\d+)$/.exec(String(note || '')); return m ? { got: Number(m[1]), total: Number(m[2]) } : null; };
const shownNote = r => (r.note && !/^prev=|^rem:/.test(r.note) && ['구매요청', '구매대기', ORDERED].indexOf(r.st) < 0) ? r.note : '';
const featOk = () => data && (data.feat || 0) >= 4;
const ordTs = ts => String(ts || '').slice(5, 16);

function renderTabs() {
  const s = data.summary;
  $('tabs').innerHTML = TABS.map(x => {
    const n = x.g === 'R' ? preOrder().length : x.g === 'V' ? ordered().length : s[x.g].low;
    const alert = (x.g === 'A' && n > 0) ? ' alert' : '';
    return '<button class="tab' + (tab === x.g ? ' on' : '') + '" data-g="' + x.g + '"><b>' + (x.g === 'R' ? '🛒' : x.g === 'V' ? '📦' : x.g) + '</b><span>' + x.t + '</span>' + (n > 0 ? '<i class="' + alert.trim() + '">' + n + '</i>' : '') + '</button>';
  }).join('');
}

function intro() {
  const st = data.settings, s = data.summary;
  if (tab === 'A') return `구매횟수 <b>${st.aMin}회 이상</b>인 자주 쓰는 베어링 ${s.A.total}종 중, 재고가 ${st.aStock}개 이하인 ${s.A.low}종입니다. 가장 먼저 채워야 합니다.`;
  if (tab === 'B') return `구매횟수 <b>${st.bMin}~${st.aMin - 1}회</b>인 베어링 ${s.B.total}종 중, 재고 ${st.bStock}개 이하 ${s.B.low}종입니다.`;
  if (tab === 'C') return `구매횟수 <b>${st.cMin}~${st.bMin - 1}회</b>인 가끔 쓰는 베어링 ${s.C.total}종 중, 재고 ${st.cStock}개 이하 ${s.C.low}종입니다. 채우는 데 시간 여유가 있습니다.`;
  if (tab === 'D') return `구매횟수가 0회(구매 이력 없음)인 베어링 ${s.D.total}종 중 재고가 없는 ${s.D.low}종입니다. 알림은 가지 않으며 참고용입니다.`;
  if (tab === 'V') return '아이마켓에서 발주를 마친 베어링입니다. 납품이 오면 <b>도착한 수량</b>을 확인하고 [입고]를 누르세요. 수량만큼 재고가 늘고 구매이력·구매횟수에 기록됩니다. 일부만 왔으면 온 수량만 입력하세요. 나머지는 목록에 남습니다.';
  return '[구매대기]로 담아 둔 목록입니다. 자동 담기가 아이마켓 장바구니에 수량만큼 담습니다. 팀장님 결재 후 아이마켓에서 직접 발주했다면 [구매]를 눌러 <b>납품</b> 목록으로 보내세요. (결제·발주는 아이마켓에서 직접)';
}

// ---- 요청 상태 표시 ----
const ST = {
  '구매대기': { cls: '', label: '구매대기' },
  '구매요청': { cls: ' buy', label: '구매요청' },
  '담는중': { cls: ' run', label: '⏳ 담는 중' },
  '담김': { cls: ' ok', label: '✓ 장바구니에 담김' },
  '미등록': { cls: ' bad', label: '❗ 미등록' },
  '확인필요': { cls: ' chk', label: '⚠ 확인 필요' },
  '발주완료': { cls: ' ord', label: '📦 발주완료' }
};
const stInfo = st => ST[st] || { cls: '', label: st };
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? '' : p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const imkLine = m => m ? '<div class="imk">IMK 코드 <code>' + esc(m) + '</code></div>' : '<div class="imk noimk">⚠ IMK 코드 없음 (시트 품목 탭 G열에 입력)</div>';

function card(it) {
  const warn = it.k > 0 ? ' warn' : '';
  const cn = catName(it.c);
  const r = it.r;
  const qv = r ? r.q : it.q;
  return '<div class="card g' + it.g + '" data-c="' + esc(it.c) + '">' +
    '<div class="top"><div><div class="nm">' + esc(it.n) + '</div><div class="muted">' + (cn ? esc(cn) + ' · ' : '') + esc(it.c) + (it.s ? ' · ' + esc(it.s) : '') + (it.l ? ' · ' + esc(it.l) : '') + '</div></div>' +
    '<div class="stock' + warn + '">' + it.k + '<small>재고</small></div></div>' +
    '<div class="meta">구매 <b>' + it.cnt + '회</b> · ' + it.g + '등급</div>' +
    imkLine(it.m) +
    (r ? '<div class="req' + stInfo(r.st).cls + '"><span>' + esc(stInfo(r.st).label) + ' · ' + esc(r.q) + '개</span><button class="mini" data-act="cancel" data-id="' + esc(r.id) + '">취소</button></div>' + (shownNote(r) ? '<div class="rnote">' + esc(shownNote(r)) + '</div>' : '') : '') +
    (r && r.st === ORDERED ? '<div class="rnote">납품이 오면 📦 납품 탭에서 입고하세요.</div>' :
    '<div class="act"><div class="stepper"><button data-act="dec" aria-label="수량 줄이기">−</button><input type="number" inputmode="numeric" min="1" value="' + esc(qv) + '" aria-label="수량"><button data-act="inc" aria-label="수량 늘리기">＋</button></div>' +
    '<button class="btn" data-act="wait">구매대기</button><button class="btn buy" data-act="order">구매</button></div>') + '</div>';
}

function reqCard(r) {
  const cn = catName(r.c), si = stInfo(r.st);
  const retry = (r.st === '미등록' || r.st === '확인필요') ? '<button class="mini" data-act="retry" data-id="' + esc(r.id) + '" data-c="' + esc(r.c) + '" data-q="' + esc(r.q) + '">다시 담기</button>' : '';
  const order = r.st === '담는중' ? '' : '<button class="mini" data-act="promote" data-id="' + esc(r.id) + '" data-c="' + esc(r.c) + '" data-q="' + esc(r.q) + '" data-n="' + esc(r.n) + '">구매</button>';
  return '<div class="card"><div class="top"><div><div class="nm">' + esc(r.n) + '</div><div class="muted">' + (cn ? esc(cn) + ' · ' : '') + esc(r.c) + '</div></div>' +
    '<div class="stock warn" style="background:#edf0f3;color:#283b49">' + esc(r.q) + '<small>개</small></div></div>' +
    imkLine(r.m) +
    '<div class="req' + si.cls + '"><span>' + esc(si.label) + '</span><span class="reqbtns">' + retry + order + '<button class="mini" data-act="cancel" data-id="' + esc(r.id) + '">취소</button></span></div>' +
    (shownNote(r) ? '<div class="rnote">' + esc(shownNote(r)) + '</div>' : '') +
    '<div class="muted" style="margin-top:6px">' + esc(r.ts.slice(5, 16)) + ' · ' + esc(r.by) + '</div></div>';
}

// 납품 목록 카드: 도착한 수량을 확인하고 [입고]
function deliverCard(r) {
  const cn = catName(r.c), rem = remInfo(r.note);
  const sub = rem ? '분납 잔량 · 이미 ' + rem.got + '/' + rem.total + '개 입고' : '발주 ' + ordTs(r.ts) + ' · ' + r.by;
  return '<div class="card gV" data-id="' + esc(r.id) + '" data-q="' + esc(r.q) + '" data-n="' + esc(r.n) + '"><div class="top"><div><div class="nm">' + esc(r.n) + '</div><div class="muted">' + (cn ? esc(cn) + ' · ' : '') + esc(r.c) + '</div></div>' +
    '<div class="stock warn" style="background:#ece8f8;color:#3d2f86">' + esc(r.q) + '<small>주문</small></div></div>' +
    '<div class="req ord"><span>' + esc(stInfo(r.st).label) + ' · ' + esc(sub) + '</span></div>' +
    '<div class="dl"><div class="lbl">도착한 수량</div><div class="act"><div class="stepper"><button data-act="dec" aria-label="수량 줄이기">−</button><input type="number" inputmode="numeric" min="1" value="' + esc(r.q) + '" aria-label="입고 수량"><button data-act="inc" aria-label="수량 늘리기">＋</button></div>' +
    '<button class="btn buy" data-act="deliver">입고</button></div>' +
    '<div class="dl2">' + (rem ? '' : '<button class="mini" data-act="revert" data-id="' + esc(r.id) + '">구매대기로 되돌리기</button>') + '<button class="mini" data-act="cancel" data-id="' + esc(r.id) + '">발주 취소</button></div></div></div>';
}

// 자동 담기 프로그램 상태 / 미등록 알림
function renderRunner() {
  const rn = data.runner || {}, b = $('runnerBanner'), u = $('unregBanner');
  const waiting = data.requests.filter(r => r.st === '구매대기' || r.st === '구매요청').length;
  let html = '', cls = 'banner info', show = false;
  if (rn.hold) {
    show = true; cls = 'banner bad';
    html = '<b>자동 담기가 멈춰 있습니다.</b><br>' + esc(rn.msg || '로그인에 실패했습니다.') + '<br>아이디·비밀번호(GitHub 비밀 저장칸)와 추가 인증 여부를 확인한 뒤 아래 버튼을 눌러주세요. 계정 잠김을 막으려고 그때까지 로그인을 다시 시도하지 않습니다.<button class="btn buy" data-act="resume">자동 담기 다시 켜기</button>';
  } else if (!rn.peekAt && waiting > 0) {
    show = true;
    html = '자동 담기 프로그램이 아직 연결되지 않았습니다. 요청은 이 목록에 기록되고, 연결되면 자동으로 담깁니다.';
  } else if (rn.ok === false && rn.msg) {
    show = true; cls = 'banner bad';
    html = '<b>자동 담기 마지막 실행에 문제가 있었습니다.</b><br>' + esc(rn.msg) + (rn.runAt ? ' (' + hhmm(rn.runAt) + ')' : '');
  }
  b.className = show ? cls : 'banner hidden'; b.innerHTML = html;
  const unreg = data.requests.filter(r => r.st === '미등록').length;
  u.classList.toggle('hidden', !(unreg > 0 && tab !== 'R'));
  u.innerHTML = '<b>미등록 상품 ' + unreg + '건</b><br>IMKmall에서 코드로 찾지 못했거나 IMK 코드가 비어 있습니다. 신규품목 요청 또는 시트 G열 코드 확인 후, 🛒 구매 목록에서 [다시 담기]를 눌러주세요.<button class="btn" data-act="gotoR">🛒 구매 목록 보기</button>';
}

function render() {
  if (!data) return;
  const at = new Date(loadedAt);
  const rn0 = data.runner || {};
  $('sub').textContent = p2(at.getHours()) + ':' + p2(at.getMinutes()) + ' 기준 · 등급은 구매횟수로 자동 계산' + (rn0.peekAt ? ' · 자동 담기 확인 ' + hhmm(rn0.peekAt) : '');
  renderTabs();
  renderRunner();
  $('verNote').classList.toggle('hidden', featOk());
  $('verNote').innerHTML = '<b>서버 코드(Code.gs)가 예전 버전입니다.</b><br>[구매] 버튼과 납품 입고를 쓰려면 Apps Script에 새 Code.gs를 붙여넣고 [배포 관리 > 수정 > 새 버전]으로 다시 배포해주세요.';
  $('intro').innerHTML = intro();
  $('issueNote').classList.toggle('hidden', !(data.issues > 0));
  $('issueNote').textContent = '구매횟수 탭에 품목과 연결되지 않은 줄이 ' + data.issues + '개 있습니다. 구글 시트 메뉴 [베어링 관리 > 구매횟수 확인]을 실행해 E열을 확인하세요. 연결되지 않은 품목은 구매횟수 0회(D)로 분류됩니다.';
  const kw = q.split(/\s+/).map(norm).filter(Boolean);
  const hit = it => kw.every(t => norm((it.c || '') + (it.n || '') + (it.s || '') + (it.l || '') + (it.m || '')).includes(t));
  let html;
  if (tab === 'R') {
    const ord = { '미등록': 0, '확인필요': 1, '담는중': 2, '구매요청': 3, '구매대기': 4, '담김': 5 };
    const rows = preOrder().filter(r => kw.every(t => norm(r.c + r.n + (r.m || '')).includes(t))).sort((a, b) => (ord[a.st] ?? 9) - (ord[b.st] ?? 9));
    html = rows.length ? rows.map(reqCard).join('') : '<div class="empty">담아 둔 구매 요청이 없습니다.</div>';
  } else if (tab === 'V') {
    const rows = ordered().filter(r => kw.every(t => norm(r.c + r.n).includes(t))).sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
    html = rows.length ? rows.map(deliverCard).join('') : '<div class="empty">' + (q ? '일치하는 발주가 없습니다.' : '납품을 기다리는 발주가 없습니다.<br>[구매]를 누른 베어링이 여기에 나타납니다.') + '</div>';
  } else {
    const rows = data.lists[tab].filter(hit);
    html = rows.length ? rows.map(card).join('') : '<div class="empty">' + (q ? '일치하는 품목이 없습니다.' : tab === 'D' ? '재고가 없는 이력 없음 품목이 없습니다.' : '재고가 소진된 품목이 없습니다. 👍') + '</div>';
  }
  const y = window.scrollY;
  $('list').innerHTML = html;
  window.scrollTo(0, y);
  const st = data.settings;
  $('rule').textContent = `등급 기준(구매횟수): A ${st.aMin}회 이상 · B ${st.bMin}~${st.aMin - 1}회 · C ${st.cMin}~${st.bMin - 1}회 · D 0회. 기준과 알림 재고는 시트의 [설정] 탭에서 바꿀 수 있습니다. 구매 입고가 기록될 때마다 그 베어링의 구매횟수가 1씩 올라갑니다.`;
}

// ---- 구매 요청 ----
function findItem(c) { for (const g of ['A', 'B', 'C', 'D']) { const it = data.lists[g].find(x => x.c === c); if (it) return it; } return null; }
async function addReq(card, mode) {
  const c = card.dataset.c, it = findItem(c);
  const qty = Number(card.querySelector('.stepper input').value);
  if (!Number.isSafeInteger(qty) || qty < 1 || qty > 100000) { toast('수량은 1 이상의 정수로 입력하세요'); return; }
  if (mode === 'order') {
    if (!featOk()) { toast('서버 코드(Code.gs)를 새 버전으로 배포해야 [구매]를 쓸 수 있습니다'); return; }
    if (!confirm((it ? it.n : c) + ' · ' + qty + '개\n\n아이마켓에서 이미 발주하셨나요?\n[확인]을 누르면 납품 목록으로 이동하고, 더는 장바구니에 담지 않습니다.')) return;
  }
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'add', mode, c, qty, by: myName() });
    if (d.ok) {
      const st = mode === 'order' ? ORDERED : '구매대기';
      const now = new Date(), ts = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ':00';
      if (it) it.r = { id: d.id, st, q: qty, note: '' };
      const i = data.requests.findIndex(r => r.id === d.id);
      const rec = { id: d.id, c, n: it ? it.n : c, m: it ? it.m : '', q: qty, st, ts, by: myName(), note: '' };
      if (i >= 0) data.requests[i] = rec; else data.requests.unshift(rec);
      toast(mode !== 'order' && d.noImk ? 'IMK 코드가 없어 자동 담기에서 제외됩니다. 시트 G열에 입력하세요' : (mode === 'order' ? '발주완료로 기록했습니다 · 📦 납품 탭에서 입고하세요' : '구매대기에 담았습니다'));
      render();
      if (mode === 'order') load(false); // 서버 기준(발주 시각 등)으로 다시 맞춤
    } else if (d.error === 'PIN' || d.error === 'FORBIDDEN') { pin = ''; showGate('PIN이 바뀐 것 같습니다. 마스터 PIN을 다시 입력해주세요.'); }
    else { toast(d.msg || '기록하지 못했습니다'); card.querySelectorAll('button').forEach(b => b.disabled = false); }
  } catch (e) { toast('인터넷 연결을 확인하세요'); card.querySelectorAll('button').forEach(b => b.disabled = false); }
}
async function cancelReq(id, btn) {
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'cancel', id });
    if (d.ok || d.error === 'CLOSED' || d.error === 'NOT_FOUND') {
      data.requests = data.requests.filter(r => r.id !== id);
      ['A', 'B', 'C', 'D'].forEach(g => data.lists[g].forEach(it => { if (it.r && it.r.id === id) it.r = null; }));
      toast(d.ok ? (d.ordered ? '취소했습니다. 이미 낸 발주는 아이마켓에서 직접 취소해주세요' : d.inCart ? '취소했습니다. 이미 담긴 상품은 IMKmall 장바구니에서 직접 빼주세요' : '취소했습니다') : (d.msg || '이미 처리된 요청입니다'));
      render();
    } else { toast(d.msg || '취소하지 못했습니다'); btn.disabled = false; }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}

async function retryReq(btn) {
  const c = btn.dataset.c, qty = Number(btn.dataset.q) || 1;
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'add', mode: 'wait', c, qty, by: myName() });
    if (d.ok) {
      const r = data.requests.find(x => x.id === d.id);
      if (r) { r.st = '구매대기'; r.note = ''; r.q = qty; }
      toast(d.noImk ? 'IMK 코드가 아직 비어 있습니다. 시트 G열에 입력하세요' : '다시 담기를 요청했습니다');
      render();
    } else { toast(d.msg || '요청하지 못했습니다'); btn.disabled = false; }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}
// 구매목록의 [구매]: 아이마켓에서 직접 발주를 마친 요청 → 납품 목록으로
async function promoteReq(btn) {
  const id = btn.dataset.id, c = btn.dataset.c, qty = Number(btn.dataset.q) || 1, n = btn.dataset.n || c;
  if (!featOk()) { toast('서버 코드(Code.gs)를 새 버전으로 배포해야 [구매]를 쓸 수 있습니다'); return; }
  if (!confirm(n + ' · ' + qty + '개\n\n아이마켓에서 이미 발주하셨나요?\n[확인]을 누르면 납품 목록으로 이동하고, 더는 장바구니에 담지 않습니다.')) return;
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'add', mode: 'order', c, qty, by: myName() });
    if (d.ok) {
      const r = data.requests.find(x => x.id === d.id || x.id === id);
      if (r) { r.st = ORDERED; r.note = ''; r.q = qty; }
      ['A', 'B', 'C', 'D'].forEach(g => data.lists[g].forEach(it => { if (it.r && it.r.id === (r ? r.id : id)) { it.r.st = ORDERED; it.r.q = qty; it.r.note = ''; } }));
      toast('발주완료로 기록했습니다 · 📦 납품 탭에서 입고하세요');
      render();
      load(false); // 서버 기준으로 다시 맞춤
    } else { toast(d.msg || '기록하지 못했습니다'); btn.disabled = false; }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}
// 납품 목록의 [입고]: 도착한 수량만큼 재고 +, 구매이력·구매횟수 기록. 일부만 왔으면 나머지는 목록에 남음
async function deliverReq(cardEl, btn) {
  const id = cardEl.dataset.id, ordQ = Number(cardEl.dataset.q) || 0, n = cardEl.dataset.n || '';
  const qty = Number(cardEl.querySelector('.stepper input').value);
  if (!Number.isSafeInteger(qty) || qty < 1 || qty > 100000) { toast('입고 수량은 1 이상의 정수로 입력하세요'); return; }
  if (!featOk()) { toast('서버 코드(Code.gs)를 새 버전으로 배포해야 입고할 수 있습니다'); return; }
  const left = ordQ - qty;
  const msg = n + '\n' + qty + '개를 입고합니다. (재고 +' + qty + ')' + (left > 0 ? '\n나머지 ' + left + '개는 납품 목록에 남습니다.' : '') + (left < 0 ? '\n※ 주문 수량(' + ordQ + '개)보다 많습니다.' : '');
  if (!confirm(msg)) return;
  cardEl.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const d = await post({ pin, action: 'deliver', id, qty, by: myName() });
    if (d.ok) {
      toast('✓ ' + (d.n || n) + ' ' + d.qty + '개 입고' + (d.stock != null ? ' (재고 ' + d.stock + '개)' : '') + (d.left > 0 ? ' · 잔량 ' + d.left + '개 남음' : ''));
      await load(false); // 재고·목록을 서버 기준으로 다시 불러옴
    } else if (d.error === 'CLOSED' || d.error === 'NOT_FOUND') {
      toast(d.msg || '이미 처리된 건입니다'); await load(false);
    } else if (d.error === 'PIN' || d.error === 'FORBIDDEN') { pin = ''; showGate('PIN이 바뀐 것 같습니다. 마스터 PIN을 다시 입력해주세요.'); }
    else { toast(d.msg || '입고하지 못했습니다'); cardEl.querySelectorAll('button').forEach(b => b.disabled = false); }
  } catch (e) {
    toast('인터넷 연결을 확인하세요. 입고가 됐는지 새로고침으로 확인하세요');
    cardEl.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}
async function revertReq(btn) {
  const id = btn.dataset.id;
  if (!confirm('구매대기로 되돌립니다.\n자동 담기가 아이마켓 장바구니에 다시 담습니다.')) return;
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'purchaseReq', op: 'revert', id });
    if (d.ok) { toast('구매대기로 되돌렸습니다'); await load(false); }
    else { toast(d.msg || '되돌리지 못했습니다'); btn.disabled = false; if (d.error === 'CLOSED' || d.error === 'NOT_FOUND') load(false); }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}
async function resumeRunner(btn) {
  btn.disabled = true;
  try {
    const d = await post({ pin, action: 'runnerResume' });
    if (d.ok) { toast('자동 담기를 다시 켰습니다'); load(true); } else { toast(d.msg || '처리하지 못했습니다'); btn.disabled = false; }
  } catch (e) { toast('인터넷 연결을 확인하세요'); btn.disabled = false; }
}

// ---- 이벤트 ----
$('runnerBanner').addEventListener('click', e => { const b = e.target.closest('button[data-act="resume"]'); if (b) resumeRunner(b); });
$('unregBanner').addEventListener('click', e => { if (e.target.closest('button[data-act="gotoR"]')) { tab = 'R'; render(); window.scrollTo(0, 0); } });
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.g; render(); window.scrollTo(0, 0); });
$('q').addEventListener('input', () => { q = $('q').value.trim(); render(); });
$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, cardEl = b.closest('.card');
  if (act === 'cancel') { cancelReq(b.dataset.id, b); return; }
  if (act === 'retry') { retryReq(b); return; }
  if (act === 'promote') { promoteReq(b); return; }
  if (act === 'revert') { revertReq(b); return; }
  if (act === 'deliver') { deliverReq(cardEl, b); return; }
  const inp = cardEl.querySelector('.stepper input');
  if (act === 'dec') inp.value = Math.max(1, (Number(inp.value) || 1) - 1);
  else if (act === 'inc') inp.value = (Number(inp.value) || 0) + 1;
  else if (act === 'wait' || act === 'order') addReq(cardEl, act);
});
$('list').addEventListener('focusin', e => { if (e.target.matches('.stepper input')) e.target.select(); });
$('refresh').onclick = () => load(true);
$('gateOk').onclick = () => { const v = $('pinIn').value.trim(); if (!v) { $('gateErr').textContent = 'PIN을 입력하세요.'; return; } pin = v; $('gateErr').textContent = '확인 중…'; load(false); };
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('gateOk').click(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - loadedAt > 60000) load(false); });

cands = pinCandidates();
load(false);
</script>
</body>
