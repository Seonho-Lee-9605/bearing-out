<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>베어링 출고관리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="베어링">
<meta name="apple-mobile-web-app-title" content="베어링">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--p:#1f4e79;--bg:#f3f5f8;--out:#c0392b;--ok:#1b7f4b;--line:#dde2e8;--muted:#6b7683}
*{box-sizing:border-box}
.hidden{display:none!important}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:#1c2530;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:10px 14px 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{margin-top:6px;font-size:13px}
.chip{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:16px;padding:6px 12px;font-size:14px}
#adminBar{display:none;gap:8px;margin-top:8px}
#adminBar .chip{flex:1;background:#fff;color:var(--p);font-weight:700;padding:10px 8px;font-size:15px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(116px,34%,300px);gap:10px;padding:10px 10px 0;width:100%;max-width:960px;margin:0 auto}
.pane{display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
#q{width:100%;padding:14px;font-size:18px;border:2px solid var(--line);border-radius:12px;background:#fff}
#q:focus{outline:none;border-color:var(--p)}
.muted{color:var(--muted);font-size:13px}
#listTitle{margin:8px 2px 6px}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;font-size:14px}
.item b{font-size:16px}
.stock{min-width:42px;text-align:center;border-radius:8px;padding:5px 6px;background:#e8f1fa;color:var(--p);font-weight:700}
.stock.low{background:#fdecea;color:var(--out)}
h3{margin:8px 2px 6px;font-size:14px;color:var(--muted)}
.h{font-size:13px;line-height:1.35;background:#fff;border-radius:10px;padding:8px 9px;margin-bottom:6px}
.h .n{font-weight:700;font-size:14px;word-break:break-all}
.tag-out{color:var(--out);font-weight:700}.tag-in{color:var(--ok);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center;padding:20px;z-index:20}
.panel{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.panel.card{border-radius:16px;padding:20px 18px}
.big{font-size:22px;font-weight:700}
.seg{display:flex;gap:8px;margin:14px 0}
.seg button{flex:1;padding:14px;font-size:18px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:12px;color:var(--muted)}
.seg button.on.out{background:var(--out);border-color:var(--out);color:#fff}
.seg button.on.in{background:var(--ok);border-color:var(--ok);color:#fff}
.qty{display:flex;gap:8px;margin-bottom:12px}
.qty button{width:64px;font-size:28px;border:2px solid var(--line);background:#fff;border-radius:12px}
.qty input{flex:1;text-align:center;font-size:26px;font-weight:700;border:2px solid var(--line);border-radius:12px;min-width:0}
.panel input[type=text],.panel input:not([type]),.f{width:100%;padding:12px;font-size:16px;border:2px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;color:inherit;font-family:inherit}
.f:focus{outline:none;border-color:var(--p)}
.lb{font-size:13px;color:var(--muted);margin:6px 2px 4px}
.codebox{background:#e8f1fa;color:var(--p);border-radius:10px;padding:11px 12px;margin-bottom:10px;font-size:15px}
.codebox b{font-size:19px}
.selbox{background:#e8f1fa;border:2px solid var(--p);border-radius:10px;padding:11px 12px;margin-bottom:12px}
.pick{max-height:34vh;overflow:auto;margin-bottom:10px}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--p);color:#fff}
.btn:disabled{opacity:.4}
.btn.gray{flex:0 0 90px;background:#e6e9ee;color:#333}
.btn.out{background:var(--out)}.btn.in{background:var(--ok)}
.errtitle{font-size:20px;font-weight:700;color:var(--out);margin-bottom:12px}
.errbody{background:#fdecea;border-radius:10px;padding:12px;margin-bottom:14px;line-height:1.6}
.errbody b{font-size:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}

.status-wait{background:#fff3ce!important;color:#855d13!important;border:1px solid #e8cd85}
.status-ok{background:#e6f3e9!important;color:#21633e!important;border:1px solid #b9dbc4}
.status-error{background:#fff0ed!important;color:#a7382d!important;border:1px solid #e8b4ac}
.offline-note{font-size:11px;margin-top:7px;padding:5px 8px;border-radius:6px;line-height:1.5}
.empty-hint{background:white;padding:20px 12px;border-radius:12px;color:#657586;font-size:13px;line-height:1.7;border:1px solid var(--line)}
button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #9cb9cf;outline-offset:2px}

:root{--p:#23465b;--bg:#f2f4f6;--line:#d6dde3;--muted:#667583}
header{padding:14px 12px 10px}.chip{border-radius:8px;min-height:40px}
.brand{display:flex;align-items:center;gap:8px}.brand b{font-size:17px}
#menuBtn{font-size:23px;padding:2px 10px}#whoBtn{font-size:12px;padding:6px 8px}
.item{min-height:76px;padding:12px 10px;border-radius:9px}.stock{background:#edf0f3;color:#283b49;min-width:40px}.stock small{display:block;font-size:10px;font-weight:500}
.stock.low{background:#fff0ed;color:#a7382d}.stock.warn{background:#fff0da;color:#a34d0b}
.seg button.on.out,.btn.out{background:var(--p);border-color:var(--p)}
#adminBar{flex-wrap:wrap;border-top:1px solid #ffffff35;padding-top:10px}#adminBar .chip{font-size:13px}
.drawer{margin:0;border:0;padding:22px 18px;width:min(340px,90vw);height:100dvh;max-height:100dvh;background:#f6f8fa;color:#243745;box-shadow:8px 0 36px #142d4930}
.drawer::backdrop{background:#14253670}.menu-action{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left;font-size:15px;color:#243745}
.menu-action[aria-pressed=true]{border-color:var(--p);background:#e6eef3;font-weight:700}.menu-label{margin-top:24px;font-size:13px;color:var(--muted)}
#filterRow{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:#e6eef3;border-radius:8px;padding:7px;font-size:12px}#clearFilter{border:0;background:transparent;color:var(--p);padding:5px}
#sSub{line-height:1.7;margin-top:6px}.stock-detail{display:inline-block;padding:2px 8px;border-radius:5px}
@media(max-width:380px){main{gap:7px;padding:8px 8px 0}.brand b{font-size:15px}.item{padding:9px 7px}.item b{font-size:15px}}
.history-note{font-size:11px;line-height:1.5;margin:0 2px 8px}.history-count{font-size:11px;font-weight:500}#hist .h{padding:10px 9px;border:1px solid var(--line);line-height:1.5}#hist .n{font-size:15px;overflow-wrap:anywhere;word-break:normal}#hist .history-action{font-size:13px;font-weight:650;margin:4px 0}#hist .history-person{font-size:13px;overflow-wrap:anywhere}#hist time{display:block;font-size:11px;color:var(--muted)}
.failure-card{padding:12px 0;border-bottom:1px solid #e8b4ac}.failure-card:last-child{border-bottom:0}.failure-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.failure-head strong{overflow-wrap:anywhere}.failure-dismiss{flex:0 0 44px;min-height:44px;border:1px solid #d9a9a3;border-radius:8px;background:#fff;color:#8b3028;font-size:24px}.failure-meta{font-size:13px;margin:4px 0}.failure-note{font-size:12px;line-height:1.5;margin:0 0 8px;color:#69433e}
</style>
</head>
<body>
<header>
  <div class="row"><div class="brand"><button id="menuBtn" class="chip" aria-label="메뉴 열기" aria-controls="menuDrawer">☰</button><b>베어링 출고관리</b></div><button id="whoBtn" class="chip"></button></div>
  <div class="row sub"><button id="stat" class="chip"></button><button id="syncBtn" class="chip">목록 새로고침</button></div>
  <div id="adminBar"><button id="buyBtn" class="chip">구매 입고</button><button id="addBtn" class="chip">신규 품목 등록</button><button id="masterBtn" class="chip" style="display:none">구매 관리</button></div>
<div id="offlineNotice" class="offline-note hidden"></div></header>
<dialog id="menuDrawer" class="drawer" aria-labelledby="menuTitle">
<div class="row"><b id="menuTitle">메뉴</b><button id="menuClose" class="menu-action" style="width:auto;margin:0">닫기</button></div>
<button id="installBtn" class="menu-action">홈 화면에 추가</button><p id="installHelp" class="muted" aria-live="polite"></p>
<div class="menu-label">품목 분류로 찾기</div><p class="muted">번호를 모를 때 종류를 선택한 뒤 규격·위치로 좁혀보세요.</p>
<div id="categoryMenu"></div>
</dialog>
<main>
  <section class="pane">
    <input id="q" type="search" placeholder="번호·규격 검색 (예: 6205)" autocomplete="off">
    <div id="filterRow" class="hidden"><span id="filterName"></span><button id="clearFilter">분류 해제 ×</button></div>
    <div id="listTitle" class="muted"></div>
    <div id="list" class="scroll"></div>
  </section>
  <section class="pane">
    <h3>최근 사용 이력 <span class="history-count">50건</span></h3><div id="historyNote" class="muted history-note" aria-live="polite"></div>
    <div id="hist" class="scroll"></div>
  </section>
</main>

<!-- 출고/반납 -->
<div id="sheet" class="overlay hidden">
  <div class="panel">
    <div id="sName" class="big"></div>
    <div id="sSub" class="muted"></div>
    <div class="seg"><button id="tOut" class="on out">출고</button><button id="tIn">반납</button></div>
    <div class="qty"><button id="minus">−</button><input id="qty" type="number" inputmode="numeric" min="1" value="1"><button id="plus">＋</button></div>
    <input id="equip" list="equipList" placeholder="설비/용도 (선택)"><datalist id="equipList"></datalist>
    <input id="memo" placeholder="비고 (선택)">
    <div class="btns"><button id="cancel" class="btn gray">닫기</button><button id="ok" class="btn out">출고 확인</button></div>
  </div>
</div>

<!-- 베어링 구매(입고) : 관리자 -->
<div id="buy" class="overlay hidden">
  <div class="panel">
    <div class="big">📦 베어링 구매 (입고)</div>
    <div class="lb">1. 베어링번호를 입력하세요</div>
    <input id="buyQ" class="f" type="search" placeholder="예: 1215" autocomplete="off">
    <div id="buyHint" class="muted" style="margin-bottom:6px"></div>
    <div id="buyList" class="pick"></div>
    <div id="buySelBox" class="selbox hidden"></div>
    <div id="buyQtyWrap" class="hidden">
      <div class="lb">2. 몇 개 입고되었나요?</div>
      <div class="qty"><button id="buyMinus">−</button><input id="buyQty" type="number" inputmode="numeric" min="1" value="1"><button id="buyPlus">＋</button></div>
      <input id="buyMemo" class="f" placeholder="비고 (선택, 예: 구매처)">
    </div>
    <div class="btns"><button id="buyCancel" class="btn gray">닫기</button><button id="buyOk" class="btn in" disabled>입고 확인</button></div>
  </div>
</div>

<!-- 신규 베어링 추가 : 관리자 -->
<div id="add" class="overlay hidden">
  <div class="panel">
    <div class="big">➕ 신규 베어링 추가</div>
    <div class="lb">품목 종류</div>
    <select id="addCat" class="f"></select>
    <div class="codebox">품목코드(자동) <b id="addCode">-</b></div>
    <div class="lb" id="addNameLb">베어링 번호 (필수)</div>
    <input id="addName" class="f" placeholder="예: 1215" autocomplete="off">
    <div class="lb">규격 (선택)</div>
    <input id="addSpec" class="f" placeholder="예: 15×35×11" autocomplete="off">
    <div class="lb">보관위치 (필수)</div>
    <input id="addLoc" class="f" placeholder="예: A-1-3" autocomplete="off">
    <div class="lb">현재 재고 수량 (비우면 0)</div>
    <input id="addStock" class="f" type="number" inputmode="numeric" min="0" placeholder="0">
    <div class="btns"><button id="addCancel" class="btn gray">닫기</button><button id="addOk" class="btn">등록</button></div>
  </div>
</div>

<!-- 작업자/PIN 설정 -->
<div id="setup" class="overlay hidden">
  <div class="panel">
    <div class="big">작업자 설정</div>
    <div class="muted" style="margin:6px 0 14px">한 번 입력하면 이 휴대폰에 저장되어 다음부터 묻지 않습니다.</div>
    <input id="nameIn" placeholder="작업자 이름 (필수)" autocomplete="name">
    <input id="pinIn" type="password" class="f" required placeholder="PIN (부여받은 PIN 입력해주세요!)" inputmode="numeric" autocomplete="off">
    <div class="btns"><button id="setupCancel" class="btn gray">닫기</button><button id="setupOk" class="btn">저장</button></div>
  </div>
</div>

<!-- 중복 안내 -->
<div id="err" class="overlay center hidden">
  <div class="panel card">
    <div id="errTitle" class="errtitle"></div>
    <div id="errBody" class="errbody"></div>
    <div class="btns"><button id="errOk" class="btn">확인</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
// ▼ Apps Script 웹앱 배포 후 나오는 URL을 여기에 붙여넣으세요
const API_URL = 'https://script.google.com/macros/s/AKfycbxRHvicONvIlxnjTudbnfHnkSFSrq8eFGUXM9VEmPUWtTte7J5fA-LVKoFOZ8fdhuy9/exec';
const CONFIGURED = API_URL.startsWith('https://');
try{if(CONFIGURED)localStorage.setItem('br_api_url',API_URL);}catch(e){} // 구매 관리(master.html)가 같은 서버 주소를 쓰도록 공유

// 품목 종류 = 품목코드 접두어 (Code.gs 의 CATS 와 같게 유지)
const CATS = [
  {p:'B',  n:'베어링'},
  {p:'UB', n:'유니트베어링'},
  {p:'IB', n:'인서트베어링'},
  {p:'PB', n:'플러머블럭'},
  {p:'UBH',n:'유니트베어링 하우징'}
];

const LS = {items:'br_items',itemsAt:'br_items_at',queue:'br_queue',name:'br_name',pin:'br_pin',role:'br_role',hist:'br_hist',equips:'br_equips'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{localStorage.setItem(k,JSON.stringify(v));};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s\-_.×*]/g,'');
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12);
const p2=n=>String(n).padStart(2,'0');
const nowStr=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`};
function fetchT(u,o={},ms=20000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t));}
const post=(obj,ms)=>fetchT(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)},ms).then(r=>r.json());

let items=load(LS.items,[]), queue=load(LS.queue,[]), hist=load(LS.hist,[]);
let name=load(LS.name,''), pin=load(LS.pin,''), role=load(LS.role,'field');
let cur=null, type='출고', flushing=false, adding=false, buySel=null, tt;
let authorized=!!pin && load('br_verified_pin','')===pin, fetching=false, offlineReady=false;
let failed=load('br_failed',[]);
let category='', installPrompt=null;
let sharedHist=load('br_shared_hist',[]),historyAt=load('br_shared_hist_at',0),historyIssue='';
const stockClass=n=>n<=0?'low':n<=4?'warn':'';
const stockLabel=n=>n<=0?'재고 없음':n<=4?'재고 부족':'';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
function pending(code){return queue.filter(r=>r.code===code).reduce((a,r)=>a+(r.type==='출고'?-r.qty:r.qty),0);}
function stockOf(it){return (isFinite(it.k)?Number(it.k):0); /* 서버 확인 재고, 미전송 별도 */}
function catOf(code){const m=/^([A-Za-z]+)-/.exec(code||'');const p=m?m[1].toUpperCase():'';return CATS.find(c=>c.p===p);}
function nextCode(p){
  let max=0;
  items.forEach(i=>{const m=/^([A-Za-z]+)-(\d+)$/.exec(String(i.c).trim());if(m&&m[1].toUpperCase()===p)max=Math.max(max,Number(m[2]));});
  return p+'-'+String(max+1).padStart(3,'0');
}
function searchItems(q){
  const ts=q.split(/\s+/).map(norm).filter(Boolean);
  return items.filter(i=>{const h=norm(i.c+i.n+i.s+i.l);return ts.every(t=>h.includes(t));});
}
const itemBtn=(i,withCat)=>{const s=stockOf(i),c=catOf(i.c);
  return `<button class="item" data-c="${esc(i.c)}"><span><b>${esc(i.n)}</b><br><span class="muted">${c?esc(c.n)+' · ':''}${esc(i.c)}${i.s?' · '+esc(i.s):''}${i.l?' · '+esc(i.l):''}</span></span><span class="stock ${stockClass(s)}">${s}<small>${stockLabel(s)}</small></span></button>`;};

function renderList(){
  if(!authorized){$('listTitle').textContent='PIN 확인 후 이용해주세요.';$('list').innerHTML='';return;}
  const q=$('q').value.trim();
  let rows;
  if(!items.length){
    $('listTitle').textContent=CONFIGURED?'품목 목록이 없습니다. 인터넷 연결 후 "목록 새로고침"을 눌러주세요.':'API_URL 설정이 필요합니다 (설치 안내 참고).';
    $('list').innerHTML='';return;
  }
  if(!q&&!category){
    const recent=[...new Set(hist.filter(h=>h.st==='완료').map(h=>h.c).filter(Boolean))].slice(0,8);
    rows=recent.map(c=>items.find(i=>i.c===c)).filter(Boolean);
    $('listTitle').textContent=rows.length?'이 기기의 최근 사용 · '+rows.length+'종':'등록 '+items.length+'종 · 품번이나 위치로 검색하세요';
    if(!rows.length){$('list').innerHTML='<div class="empty-hint"><b>어떤 베어링이 필요하세요?</b><p>위 검색창에 품번 또는 위치를 입력하세요.</p><p>예: 6205 · A-1</p><small>사용 후에는 최근 품목이 여기에 표시됩니다.</small></div>';return;}
  }else{
    rows=searchItems(q).filter(i=>!category||(category==='other'?!catOf(i.c):catOf(i.c)?.p===category));
    if(category)rows.sort((a,b)=>String(a.c).localeCompare(String(b.c),'en',{numeric:true,sensitivity:'base'}));
    $('listTitle').textContent=rows.length?(category&&!q?`전체 ${rows.length}종 · 코드 순`:`검색 결과 ${rows.length}건`):'일치하는 품목이 없습니다';
  }

// 전송 대기열에 넣고 화면 갱신 (출고/반납/입고 공통)
function enqueue(rec){
 if(!authorized||!pin){showError('접근 실패','PIN을 입력하고 확인해주세요.');openSetup();return false;}
 const next=[...queue,rec];
 try{save(LS.queue,next);}catch(e){showError('기기 저장 실패','기록을 보관하지 못했습니다. 입력 내용을 유지합니다. 관리자에게 문의해주세요.');return false;}
 queue=next;hist.unshift({id:rec.id,c:rec.code,ts:rec.ts,n:rec.name,type:rec.type,qty:rec.qty,st:'대기'});hist=hist.slice(0,50);
 try{save(LS.hist,hist);}catch(e){} // queue is the durable source; history is only a view
 renderAll();toast('기기에 보관 · 전송 대기');flush();return true;
}
function showError(title,message){$('errTitle').textContent=title;$('errBody').textContent=message;$('err').classList.remove('hidden');}
function showFailures(){
 if(!failed.length){$('err').classList.add('hidden');return;}
 $('errTitle').textContent='확인 필요 '+failed.length+'건';
 $('errBody').innerHTML='<p class="failure-note">내용을 확인했으면 ×를 눌러 알림을 지우세요. 재고는 변경되지 않습니다. 실제로 가져간 물량이 있다면 관리자에게 알려주세요.</p>'+failed.map(r=>'<div class="failure-card"><div class="failure-head"><strong>'+esc(r.name||r.code)+'</strong><button type="button" class="failure-dismiss" data-dismiss-failure="'+esc(r.id)+'" aria-label="'+esc(r.name||r.code)+' 알림 확인 후 지우기" title="확인 후 알림 지우기">×</button></div><div class="failure-meta">'+esc(r.type)+' '+esc(r.qty)+'개'+(r.equip?' · '+esc(r.equip):'')+'</div><div>'+esc(r.message||'관리자에게 문의해주세요.')+'</div></div>').join('');
 $('err').classList.remove('hidden');
}
function dismissFailure(id){
 const record=failed.find(r=>r.id===id);if(!record)return;
 const next=failed.filter(r=>r.id!==id);
 try{
  const archive=load('br_failed_ack',[]);
  // Retain the rejected details locally before removing the active notification.
  if(!archive.some(r=>r.id===id))save('br_failed_ack',[...archive,{...record,acknowledgedAt:new Date().toISOString()}]);
  save('br_failed',next);
 }catch(e){toast('알림 정리를 저장하지 못했습니다. 다시 시도해주세요.');return;}
 failed=next;renderStatus();showFailures();
 if(!failed.length)toast('확인한 알림을 지웠습니다.');
}

function findDup(p,nm){const k=norm(nm);return items.find(i=>{const c=catOf(i.c);return c&&c.p===p&&norm(i.n)===k;});}
function showDup(code,nm,catName,stock){
  $('errTitle').textContent=`보유중인 ${catName} 재고입니다.`;
  $('errBody').innerHTML=`품목코드: <b>${esc(code)}</b><br>번호: ${esc(nm)}<br>현재재고: ${stock}개<br><span class="muted">재고를 늘리려면 "베어링 구매"로 입고하세요.</span>`;
  $('err').classList.remove('hidden');

async function submitAdd(){
  if(adding)return;
  const p=$('addCat').value, c=CATS.find(x=>x.p===p);
  const nm=$('addName').value.trim(), sp=$('addSpec').value.trim(), lc=$('addLoc').value.trim(), st=$('addStock').value.trim();
  if(!nm){toast('번호를 입력하세요');return;}
  if(!lc){toast('보관위치를 입력하세요');return;}
  const k=st===''?0:Number(st);
  if(!(k>=0)||!Number.isInteger(k)){toast('재고는 0 이상의 정수로 입력하세요');return;}
  const dup=findDup(p,nm);
  if(dup){showDup(dup.c,dup.n,c.n,stockOf(dup));return;}
  if(!name){openSetup();return;}
  if(!CONFIGURED){toast('API_URL 설정이 필요합니다');return;}
  adding=true;$('addOk').disabled=true;$('addOk').textContent='등록 중…';
  try{
    const d=await post({pin,action:'addItem',cat:p,name:nm,spec:sp,loc:lc,stock:k,worker:name},30000);
    if(d.ok){
      items.push(d.item);save(LS.items,items);
      $('add').classList.add('hidden');renderAll();
      toast(`${d.item.c} 등록 완료`);
    }else if(d.error==='DUP'){showDup(d.code,d.name,d.cat,d.stock);}
    else if(d.error==='PIN'){toast('PIN이 맞지 않습니다');openSetup();}
    else if(d.error==='FORBIDDEN'){toast('관리자 PIN으로 접속해야 합니다');}
    else toast(d.msg||'등록에 실패했습니다');
  }catch(e){toast('인터넷 연결이 필요합니다. 연결된 곳에서 다시 시도하세요');}
  finally{adding=false;$('addOk').disabled=false;$('addOk').textContent='등록';}
}

// ---------- 서버 통신 ----------
async function fetchItems(manual){
 if(!CONFIGURED||!authorized||flushing||fetching)return;
 fetching=true;
 try{const d=await post({pin,action:'items'});if(d.ok){acceptHistory(d);items=d.items;save(LS.items,items);save(LS.itemsAt,Date.now());role=d.role||'field';save(LS.role,role);if(manual)toast('서버 재고를 확인했습니다');}else if(d.error==='PIN'){authorized=false;showError('접근 실패','PIN이 없거나 맞지 않습니다. PIN을 다시 입력해주세요.');openSetup();}}
 catch(e){historyIssue='연결 확인 필요 · 마지막 조회 이력';if(manual)toast('연결 또는 기기 저장 실패 · 마지막 확인 재고 표시');}
 finally{fetching=false;renderAll();}
}
async function flush(manual){
 if(!CONFIGURED||!authorized||flushing||fetching)return;
 flushing=true;let sent=false;
 try{while(queue.length){
   const batch=queue.slice(0,30),d=await post({pin,records:batch});
   if(!d.ok){if(d.error==='PIN'){authorized=false;showError('접근 실패','PIN을 입력하고 확인해주세요.');openSetup();}else if(manual)showError('전송 대기',d.msg||'저장을 확인하지 못했습니다. 기록을 보관하고 재전송합니다.');break;}
   const saved=d.saved||[],rejected=(d.rejected||[]).map(r=>typeof r==='string'?{id:r,message:'확인 필요 · 관리자에게 문의해주세요.'}:r);
   const done=new Set([...saved,...rejected.map(r=>r.id)]);if(!done.size)break;
   const nextFailed=[...failed];for(const r of rejected){const original=batch.find(x=>x.id===r.id);if(original&&!nextFailed.some(x=>x.id===r.id))nextFailed.push({...original,...r});}
   // Persist failure details BEFORE removing anything from the durable outbox.
   save('br_failed',nextFailed);const next=queue.filter(x=>!done.has(x.id));save(LS.queue,next);failed=nextFailed;queue=next;
   hist.forEach(h=>{if(saved.includes(h.id))h.st='완료';else if(rejected.some(r=>r.id===h.id))h.st='거부됨';});save(LS.hist,hist);
   sent=true;renderAll();if(rejected.length)showFailures();
 }}catch(e){if(manual)showError('전송 대기','서버 응답 또는 기기 저장을 확인하지 못했습니다. 같은 기록 번호로 다시 전송합니다.');}
 finally{flushing=false;renderAll();}
 if(authorized)await fetchItems(false);
}
function openSetup(){
 if(queue.length||flushing||fetching){toast('전송 대기 기록과 진행 중 처리를 완료한 뒤 전환해주세요.');return;}
 $('nameIn').value=name;$('pinIn').value='';$('setupCancel').style.display=authorized?'':'none';$('setup').classList.remove('hidden');
}
async function saveSetup(){
 const n=$('nameIn').value.trim(),np=$('pinIn').value.trim();
 if(!n){toast('이름을 입력하세요');return;}
 if(!np){showError('접근 실패','PIN은 필수입니다. PIN을 입력해주세요.');return;}
 if(flushing||fetching){toast('처리 중입니다. 잠시 후 다시 시도해주세요.');return;}
 $('setupOk').disabled=true;
 try{const d=await post({pin:np,action:'items'});if(!d.ok){showError('접근 실패','PIN이 맞지 않습니다. 관리자에게 문의해주세요.');return;}
 save(LS.name,n);save(LS.pin,np);save('br_verified_pin',np);name=n;pin=np;authorized=true;role=d.role||'field';acceptHistory(d);items=d.items;save(LS.role,role);save(LS.items,items);save(LS.itemsAt,Date.now());$('setup').classList.add('hidden');renderAll();await flush();
 }catch(e){showError('접근 확인 실패','최초 PIN 확인에는 인터넷과 기기 저장이 필요합니다. 연결 상태를 확인해주세요.');}
 finally{$('setupOk').disabled=false;}
}

 $('installHelp').textContent=ios?'Safari에서 이 페이지 열기 → 공유 → 홈 화면에 추가 → 추가를 눌러주세요.':'브라우저 메뉴(⋮ 또는 …) → 홈 화면에 추가 또는 앱 설치를 선택하세요. 메뉴가 없으면 Chrome 또는 Edge에서 이 주소를 열어주세요.';
}

$('addOk').onclick=submitAdd;
$('errOk').onclick=()=>$('err').classList.add('hidden');
$('errBody').addEventListener('click',e=>{const button=e.target.closest('[data-dismiss-failure]');if(button)dismissFailure(button.dataset.dismissFailure);});

$('whoBtn').onclick=()=>openSetup();
$('setupOk').onclick=saveSetup;
$('setupCancel').onclick=()=>$('setup').classList.add('hidden');
$('stat').onclick=()=>{if(failed.length){showFailures();return;}if(queue.length)showError('이 기기의 전송 대기',queue.map(r=>(r.name||r.code)+' · '+r.type+' '+r.qty+'개').join('\n'));flush(true);};
$('syncBtn').onclick=()=>fetchItems(true);
window.addEventListener('online',()=>flush());
setInterval(()=>{if(queue.length)flush();else if(document.visibilityState==='visible'&&Date.now()-historyAt>=60000)fetchItems(false);},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-historyAt>=60000){if(queue.length)flush();else fetchItems(false);}});

queue.forEach(r=>{if(!hist.some(h=>h.id===r.id))hist.unshift({id:r.id,c:r.code,ts:r.ts||'',n:r.name||r.code,type:r.type,qty:r.qty,st:'대기'});});
renderAll();
if(!name||!authorized)openSetup();else flush();
// 안내 문구: 평소에는 아무 것도 보이지 않고, 인터넷이 끊겼을 때만 표시합니다. (오프라인 화면 준비 상태는 화면에 표시하지 않음)
(function(){
 const n=$('offlineNotice');
 const sync=()=>{
  if(navigator.onLine===false){n.textContent='인터넷 연결 없음 · 입력한 내용은 이 폰에 저장되고, 연결되면 자동으로 전송됩니다.';n.className='offline-note status-wait';}
  else{n.textContent='';n.className='offline-note hidden';}
 };
 window.addEventListener('online',sync);window.addEventListener('offline',sync);
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('sw register failed',e));}
 sync();
})();
</script>
</body>
</html>
